<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="nisan.css" />
  </head>
  <body>
    <main>
      <div class="turn-container">
        <h3 class="turn-box">Turn For</h3>
        <div class="player align">O</div>
        <div class="player align">X</div>
        <div class="bg"></div>
      </div>
      <div class="msg-container" id="hide">
        <!-- <p id="msg">Winner!</p> -->
        <h1 id="msg">Winner!</h1>
        <button id="newGame">New Game</button>
      </div>
      <h1>Tic Tac Toe</h1>
      <div id="container">
        <div id="game">
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
          <button class="box"></button>
        </div>
        <button id="reset">Restart Game</button>
      </div>
    </main>
    <script src="game2.js"></script>
  </body>
</html>
